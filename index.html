<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#020720" />
  <meta name="description" content="PORO — маленька ретро-аркада кав'ярні." />
  <title>PORO — Retro Games</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="arcade-page">
    <section class="pixel-frame" aria-label="PORO retro games">
      <header class="brand-block">
        <div class="brand-chip">
          <span class="brand-word">PORO</span>
        </div>
      </header>

      <div class="game-grid" id="games">
        <button class="game-card" type="button" data-open-game="snake" aria-label="Грати Coffee Snake">
          <span class="game-art" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <path class="blue" d="M10 35h8v-8h8v8h8v8h8v8H26v-8H10z"/>
              <rect class="violet" x="46" y="13" width="9" height="9"/>
              <rect class="violet" x="50" y="9" width="5" height="5"/>
            </svg>
          </span>
          <span class="game-title">SNAKE</span>
          <span class="game-best">BEST <b id="best-snake">0</b></span>
        </button>

        <button class="game-card" type="button" data-open-game="catcher" aria-label="Грати Bean Catcher">
          <span class="game-art" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <path class="blue" d="M14 38h30v12H18l-4-12zm30 3h8v7h-8z"/>
              <rect class="violet" x="22" y="10" width="7" height="10"/>
              <rect class="violet" x="37" y="17" width="7" height="10"/>
              <rect class="violet" x="12" y="18" width="7" height="10"/>
            </svg>
          </span>
          <span class="game-title">BEAN CATCH</span>
          <span class="game-best">BEST <b id="best-catcher">0</b></span>
        </button>

        <button class="game-card" type="button" data-open-game="memory" aria-label="Грати Coffee Memory">
          <span class="game-art" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <rect class="blue" x="10" y="10" width="18" height="18"/>
              <rect class="violet" x="36" y="10" width="18" height="18"/>
              <rect class="violet" x="10" y="36" width="18" height="18"/>
              <rect class="blue" x="36" y="36" width="18" height="18"/>
              <rect class="dark" x="16" y="16" width="6" height="6"/>
              <rect class="dark" x="42" y="42" width="6" height="6"/>
            </svg>
          </span>
          <span class="game-title">MEMORY</span>
          <span class="game-best">BEST <b id="best-memory">—</b></span>
        </button>

        <button class="game-card" type="button" data-open-game="pong" aria-label="Грати Espresso Pong">
          <span class="game-art" aria-hidden="true">
            <svg viewBox="0 0 64 64" role="img">
              <rect class="blue" x="8" y="13" width="7" height="38"/>
              <rect class="violet" x="49" y="13" width="7" height="38"/>
              <rect class="blue" x="29" y="27" width="7" height="7"/>
              <rect class="violet" x="29" y="9" width="4" height="8"/>
              <rect class="violet" x="29" y="45" width="4" height="8"/>
            </svg>
          </span>
          <span class="game-title">PONG</span>
          <span class="game-best">BEST <b id="best-pong">0</b></span>
        </button>
      </div>

      <div class="mini-decor" aria-hidden="true">
        <span></span><span></span><i></i><span></span><span></span>
      </div>
    </section>
  </main>

  <dialog class="game-dialog" id="gameDialog">
    <div class="game-shell">
      <div class="game-toolbar">
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" aria-label="Увімкнути звук">♪ OFF</button>
        <strong id="dialogTitle">Coffee Snake</strong>
        <button class="close-btn" id="closeGame" type="button" aria-label="Закрити гру">×</button>
      </div>

      <div class="scorebar">
        <span>SCORE <b id="currentScore">0</b></span>
        <span>BEST <b id="currentBest">0</b></span>
      </div>

      <div class="game-stage" id="gameStage">
        <canvas id="gameCanvas" width="420" height="420" aria-label="Ігрове поле"></canvas>
        <div id="memoryBoard" class="memory-board" hidden></div>
        <div class="game-overlay" id="gameOverlay">
          <p class="overlay-kicker" id="overlayKicker">READY?</p>
          <h2 id="overlayTitle">Coffee Snake</h2>
          <p id="overlayText">Swipe to move.</p>
          <button id="startGame" type="button">START</button>
        </div>
      </div>

      <p class="touch-hint" id="keyboardHint">Свайп ← ↑ ↓ →</p>

      <div class="controls" id="directionControls" hidden>
        <button type="button" data-dir="up" aria-label="Вгору">▲</button>
        <div>
          <button type="button" data-dir="left" aria-label="Ліворуч">◀</button>
          <button type="button" data-dir="down" aria-label="Вниз">▼</button>
          <button type="button" data-dir="right" aria-label="Праворуч">▶</button>
        </div>
      </div>

      <div class="pong-controls" id="pongControls" hidden>
        <button type="button" data-pong="left">◀</button>
        <button type="button" data-pong="right">▶</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
